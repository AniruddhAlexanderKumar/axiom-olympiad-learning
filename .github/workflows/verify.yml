name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: /
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            package-lock.json
      - run: npm run install:all
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
