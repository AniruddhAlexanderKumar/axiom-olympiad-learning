services:
  - type: web
    name: zumi
    runtime: node
    plan: free
    region: oregon
    # Installs both packages, then exports the Expo web client into app/dist.
    # The API serves that build on the same origin, so there is no CORS setup
    # and no API URL to bake into the bundle.
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: CI
        value: "true"
      - key: EXPO_PUBLIC_API_URL
        value: /
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: zumi-db
          property: connectionString
      # Judge0 is not hosted here: point these at a self-hosted instance or the
      # RapidAPI-hosted flavour. Code questions return 503 until configured.
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_KEY
        sync: false
      - key: JUDGE0_HOST
        sync: false

# A free Render Postgres expires 30 days after creation (14-day grace, then it is
# deleted). For a term-long deployment, upgrade this plan or set DATABASE_URL to
# an external database and drop this block plus the fromDatabase entry above.
databases:
  - name: zumi-db
    databaseName: zumi
    user: zumi
    plan: free
    region: oregon
